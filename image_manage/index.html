<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片粘贴与编辑工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .editor-layout {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .left-panel {
            width: 260px;
            border: 1px solid #ddd;
            background: #fff;
            padding: 10px;
            box-sizing: border-box;
        }
        .left-panel h3 {
            margin: 0 0 10px;
            font-size: 14px;
        }
        .image-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 420px;
            overflow: auto;
        }
        .image-list li {
            border: 1px solid #ddd;
            padding: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .image-list li.drag-over {
            border-color: #1677ff;
            box-shadow: inset 0 0 0 1px #1677ff;
        }
        .image-list li.active {
            border-color: #1677ff;
            background: #eaf3ff;
        }
        .list-actions button {
            margin: 0;
            padding: 2px 6px;
            font-size: 12px;
        }
        .right-panel {
            flex: 1;
        }
        .image-container {
            position: relative;
            display: block;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 320px;
            border: 1px dashed #ddd;
            background: #fafafa;
        }
        .image-wrapper {
            position: absolute;
            border: 1px solid #ccc;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            user-select: none;
        }
        .image-wrapper.active {
            border: 2px solid #1677ff;
        }
        .image-wrapper img {
            display: block;
            cursor: default;
        }
        .drag-handle {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(243, 243, 243, 0.96);
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
        }
        .image-wrapper:hover .drag-handle,
        .image-wrapper.active .drag-handle {
            opacity: 1;
            pointer-events: auto;
        }
        .drag-title {
            cursor: move;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .drag-title:hover {
            background: #e9e9e9;
        }
        .item-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .zoom-input {
            width: 56px;
            padding: 2px 4px;
            font-size: 12px;
        }
        .zoom-btn {
            margin: 0;
            padding: 2px 8px;
            font-size: 12px;
            line-height: 1.2;
        }
        .image-stage {
            position: relative;
        }
        .controls {
            margin-bottom: 20px;
        }
        .controls .active-tool {
            background: #1677ff;
            color: #fff;
            border: 1px solid #1677ff;
        }
        .controls button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .stitch-status {
            display: inline-block;
            margin-left: 4px;
            color: #666;
            font-size: 13px;
            vertical-align: middle;
        }
        .stitch-status.error {
            color: #cf1322;
        }
        button {
            padding: 8px 12px;
            margin-right: 10px;
            cursor: pointer;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <h1>图片粘贴与编辑工具</h1>
    <div class="controls">
        <button id="arrangeVertical">垂直排列</button>
        <button id="arrangeHorizontal">水平排列</button>
        <button id="selectTool">选择</button>
        <button id="drawTool" class="active-tool">涂鸦</button>
        <button id="eraseTool">擦除</button>
        <button id="pasteBtn">粘贴</button>
        <button id="autoStitchBtn" type="button" title="按当前排列方向自动去重拼接">自动拼接</button>
        <button id="deleteSelectedBtn">删除当前选中图片</button>
        <button id="clearAll">清除所有</button>
        <div style="height:8px;">&nbsp;</div>
        <span id="stitchStatus" class="stitch-status" role="status" aria-live="polite"></span>
    </div>
    <div class="container">
        <div class="editor-layout">
            <div class="left-panel">
                <h3>图片列表（可调整顺序）</h3>
                <ul id="imageList" class="image-list"></ul>
            </div>
            <div class="right-panel">
                <div class="image-container" id="imageContainer"></div>
            </div>
        </div>
        <div>
            <p>粘贴图片到以下区域：</p>
            <div id="pasteArea" tabindex="0" style="border: 2px dashed #ccc; padding: 20px; min-height: 100px;">
                点击此处后粘贴图片 (Ctrl+V)
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pasteArea = document.getElementById('pasteArea');
            const imageContainer = document.getElementById('imageContainer');
            const imageList = document.getElementById('imageList');
            const arrangeVerticalBtn = document.getElementById('arrangeVertical');
            const arrangeHorizontalBtn = document.getElementById('arrangeHorizontal');
            const selectToolBtn = document.getElementById('selectTool');
            const drawToolBtn = document.getElementById('drawTool');
            const eraseToolBtn = document.getElementById('eraseTool');
            const pasteBtn = document.getElementById('pasteBtn');
            const autoStitchBtn = document.getElementById('autoStitchBtn');
            const stitchStatus = document.getElementById('stitchStatus');
            const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
            const clearAllBtn = document.getElementById('clearAll');
            const MATCH_THUMBNAIL_SIZE = 360;
            const MIN_OVERLAP_PIXELS = 24;
            const OVERLAP_SIMILARITY_THRESHOLD = 0.94;
            let images = [];
            let layoutMode = 'horizontal';
            let zIndexSeed = 1;
            let imageIdSeed = 1;
            let activeTool = 'draw'; // 默认涂鸦
            let isDrawing = false;
            let currentItem = null;
            let selectedItem = null;
            let isDragging = false;
            let dragState = null;
            let selectCycle = { x: -1, y: -1, index: 0 };
            let draggingListItemId = null;

            function setTool(tool) {
                activeTool = tool;
                selectToolBtn.classList.toggle('active-tool', tool === 'select');
                drawToolBtn.classList.toggle('active-tool', tool === 'draw');
                eraseToolBtn.classList.toggle('active-tool', tool === 'erase');
                images.forEach(item => {
                    item.canvas.style.cursor = tool === 'draw' ? 'crosshair' : tool === 'erase' ? 'cell' : 'pointer';
                });
            }

            selectToolBtn.addEventListener('click', () => setTool('select'));
            drawToolBtn.addEventListener('click', () => setTool('draw'));
            eraseToolBtn.addEventListener('click', () => setTool('erase'));
            autoStitchBtn.addEventListener('click', autoStitchImages);
            setTool('draw');

            function setStitchStatus(message, isError) {
                stitchStatus.textContent = message;
                stitchStatus.classList.toggle('error', Boolean(isError));
            }

            function setSelectedItem(item) {
                selectedItem = item;
                images.forEach(it => it.wrapper.classList.toggle('active', it === item));
                renderImageList();
            }

            function renderImageList() {
                imageList.innerHTML = '';
                images.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.draggable = true;
                    li.dataset.itemId = String(item.id);
                    if (item === selectedItem) li.classList.add('active');

                    const title = document.createElement('span');
                    title.textContent = item.name;

                    const actions = document.createElement('div');
                    actions.className = 'list-actions';

                    const upBtn = document.createElement('button');
                    upBtn.textContent = '↑';
                    upBtn.title = '上移';
                    upBtn.disabled = index === 0;
                    upBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        moveImage(index, -1);
                    });

                    const downBtn = document.createElement('button');
                    downBtn.textContent = '↓';
                    downBtn.title = '下移';
                    downBtn.disabled = index === images.length - 1;
                    downBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        moveImage(index, 1);
                    });

                    actions.appendChild(upBtn);
                    actions.appendChild(downBtn);
                    li.appendChild(title);
                    li.appendChild(actions);
                    li.addEventListener('click', function() {
                        bringToFront(item);
                        setSelectedItem(item);
                    });

                    li.addEventListener('dragstart', function(e) {
                        draggingListItemId = Number(li.dataset.itemId);
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', li.dataset.itemId);
                    });

                    li.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        li.classList.add('drag-over');
                        e.dataTransfer.dropEffect = 'move';
                    });

                    li.addEventListener('dragleave', function() {
                        li.classList.remove('drag-over');
                    });

                    li.addEventListener('drop', function(e) {
                        e.preventDefault();
                        li.classList.remove('drag-over');
                        const fromId = draggingListItemId;
                        const toId = Number(li.dataset.itemId);
                        if (!fromId || !toId || fromId === toId) return;

                        const targetRect = li.getBoundingClientRect();
                        const insertAfter = e.clientY > (targetRect.top + targetRect.height / 2);
                        reorderImagesById(fromId, toId, insertAfter);
                    });

                    li.addEventListener('dragend', function() {
                        draggingListItemId = null;
                        Array.from(imageList.querySelectorAll('li.drag-over')).forEach(el => el.classList.remove('drag-over'));
                    });

                    imageList.appendChild(li);
                });
            }

            function reorderImagesById(fromId, toId, insertAfter) {
                const fromIndex = images.findIndex(it => it.id === fromId);
                const toIndex = images.findIndex(it => it.id === toId);
                if (fromIndex < 0 || toIndex < 0) return;

                const moving = images.splice(fromIndex, 1)[0];
                let targetIndex = images.findIndex(it => it.id === toId);
                if (insertAfter) targetIndex += 1;
                images.splice(targetIndex, 0, moving);

                renderImageList();
                if (layoutMode === 'vertical') arrangeVertical();
                if (layoutMode === 'horizontal') arrangeHorizontal();
            }

            function moveImage(index, delta) {
                const newIndex = index + delta;
                if (newIndex < 0 || newIndex >= images.length) return;
                const tmp = images[index];
                images[index] = images[newIndex];
                images[newIndex] = tmp;
                renderImageList();
                if (layoutMode === 'vertical') arrangeVertical();
                if (layoutMode === 'horizontal') arrangeHorizontal();
            }

            // 监听粘贴事件
            pasteArea.addEventListener('click', function() {
                this.focus();
            });

            function handlePasteEvent(e) {
                e.preventDefault();
                const items = (e.clipboardData || window.clipboardData).items;
                
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        const blob = items[i].getAsFile();
                        const reader = new FileReader();
                        
                        reader.onload = function(event) {
                            addImageToContainer(event.target.result);
                        };
                        
                        reader.readAsDataURL(blob);
                        break;
                    }
                }
            }

            pasteArea.addEventListener('paste', handlePasteEvent);
            document.addEventListener('paste', handlePasteEvent);

            function waitForImageReady(item) {
                const img = item.img;
                if (img.complete && img.naturalWidth > 0) {
                    return Promise.resolve();
                }
                if (img.complete && img.naturalWidth === 0) {
                    return Promise.reject(new Error(`${item.name} 加载失败`));
                }

                return new Promise((resolve, reject) => {
                    const onLoad = function() {
                        cleanup();
                        resolve();
                    };
                    const onError = function() {
                        cleanup();
                        reject(new Error(`${item.name} 加载失败`));
                    };
                    const cleanup = function() {
                        img.removeEventListener('load', onLoad);
                        img.removeEventListener('error', onError);
                    };
                    img.addEventListener('load', onLoad);
                    img.addEventListener('error', onError);
                });
            }

            function createStitchSource(item, axis, commonMatchScale) {
                const width = item.img.naturalWidth || item.naturalWidth;
                const height = item.img.naturalHeight || item.naturalHeight;
                if (!width || !height) {
                    throw new Error(`${item.name} 尚未加载完成`);
                }

                const baseCanvas = document.createElement('canvas');
                baseCanvas.width = width;
                baseCanvas.height = height;
                const baseCtx = baseCanvas.getContext('2d');
                baseCtx.imageSmoothingEnabled = false;
                baseCtx.drawImage(item.img, 0, 0, width, height);

                const matchDimension = Math.max(width, height);
                const matchScale = commonMatchScale || Math.min(1, MATCH_THUMBNAIL_SIZE / matchDimension);
                const matchWidth = Math.max(1, Math.round(width * matchScale));
                const matchHeight = Math.max(1, Math.round(height * matchScale));
                const matchCanvas = document.createElement('canvas');
                matchCanvas.width = matchWidth;
                matchCanvas.height = matchHeight;
                const matchCtx = matchCanvas.getContext('2d', { willReadFrequently: true });
                matchCtx.imageSmoothingEnabled = true;
                matchCtx.drawImage(baseCanvas, 0, 0, matchWidth, matchHeight);

                return {
                    item,
                    width,
                    height,
                    baseCanvas,
                    matchWidth,
                    matchHeight,
                    matchScale,
                    matchPixels: matchCtx.getImageData(0, 0, matchWidth, matchHeight).data,
                    sourcePixels: null
                };
            }

            function getSourcePixels(source) {
                if (!source.sourcePixels) {
                    const sourceCtx = source.baseCanvas.getContext('2d', { willReadFrequently: true });
                    source.sourcePixels = sourceCtx.getImageData(0, 0, source.width, source.height).data;
                }
                return source.sourcePixels;
            }

            function calculateOverlapDifference(first, second, overlap, useSourcePixels, axis) {
                const firstPixels = useSourcePixels ? getSourcePixels(first) : first.matchPixels;
                const secondPixels = useSourcePixels ? getSourcePixels(second) : second.matchPixels;
                const firstWidth = useSourcePixels ? first.width : first.matchWidth;
                const secondWidth = useSourcePixels ? second.width : second.matchWidth;
                const firstHeight = useSourcePixels ? first.height : first.matchHeight;
                const secondHeight = useSourcePixels ? second.height : second.matchHeight;
                const isHorizontal = axis === 'horizontal';
                const crossLength = isHorizontal
                    ? Math.min(firstHeight, secondHeight)
                    : Math.min(firstWidth, secondWidth);
                const crossCount = Math.min(96, crossLength);
                const overlapCount = Math.min(96, overlap);
                if (crossCount < 1 || overlapCount < 1) return 1;

                let totalDifference = 0;
                for (let crossIndex = 0; crossIndex < crossCount; crossIndex++) {
                    const crossOffset = crossCount === 1 ? 0 : Math.round(crossIndex * (crossLength - 1) / (crossCount - 1));
                    for (let overlapIndex = 0; overlapIndex < overlapCount; overlapIndex++) {
                        const overlapOffset = overlapCount === 1 ? 0 : Math.round(overlapIndex * (overlap - 1) / (overlapCount - 1));
                        const firstX = isHorizontal ? firstWidth - overlap + overlapOffset : crossOffset;
                        const firstY = isHorizontal ? crossOffset : firstHeight - overlap + overlapOffset;
                        const secondX = isHorizontal ? overlapOffset : crossOffset;
                        const secondY = isHorizontal ? crossOffset : overlapOffset;
                        const firstPixel = (firstY * firstWidth + firstX) * 4;
                        const secondPixel = (secondY * secondWidth + secondX) * 4;
                        totalDifference += Math.abs(firstPixels[firstPixel] - secondPixels[secondPixel]);
                        totalDifference += Math.abs(firstPixels[firstPixel + 1] - secondPixels[secondPixel + 1]);
                        totalDifference += Math.abs(firstPixels[firstPixel + 2] - secondPixels[secondPixel + 2]);
                    }
                }

                return totalDifference / (crossCount * overlapCount * 255 * 3);
            }

            function calculateOverlapActivity(source, overlap, useSourcePixels, axis) {
                const pixels = useSourcePixels ? getSourcePixels(source) : source.matchPixels;
                const width = useSourcePixels ? source.width : source.matchWidth;
                const height = useSourcePixels ? source.height : source.matchHeight;
                const isHorizontal = axis === 'horizontal';
                const crossLength = isHorizontal ? height : width;
                const crossCount = Math.min(96, crossLength);
                const overlapCount = Math.min(96, overlap);
                let activeComparisons = 0;
                let comparisonCount = 0;

                for (let crossIndex = 0; crossIndex < crossCount; crossIndex++) {
                    const crossOffset = crossCount === 1 ? 0 : Math.round(crossIndex * (crossLength - 1) / (crossCount - 1));
                    for (let overlapIndex = 0; overlapIndex < overlapCount; overlapIndex++) {
                        const overlapOffset = overlapCount === 1 ? 0 : Math.round(overlapIndex * (overlap - 1) / (overlapCount - 1));
                        const x = isHorizontal ? width - overlap + overlapOffset : crossOffset;
                        const y = isHorizontal ? crossOffset : height - overlap + overlapOffset;
                        const pixel = (y * width + x) * 4;
                        const comparePixel = function(otherPixel) {
                            const change = Math.max(
                                Math.abs(pixels[pixel] - pixels[otherPixel]),
                                Math.abs(pixels[pixel + 1] - pixels[otherPixel + 1]),
                                Math.abs(pixels[pixel + 2] - pixels[otherPixel + 2])
                            );
                            activeComparisons += change >= 10 ? 1 : 0;
                            comparisonCount++;
                        };
                        if (x + 1 < width) comparePixel(pixel + 4);
                        if (y + 1 < height) comparePixel(pixel + width * 4);
                    }
                }

                return comparisonCount ? activeComparisons / comparisonCount : 0;
            }

            function findBestOverlap(first, second, axis) {
                const isHorizontal = axis === 'horizontal';
                const firstLength = isHorizontal ? first.matchWidth : first.matchHeight;
                const secondLength = isHorizontal ? second.matchWidth : second.matchHeight;
                const maxOverlap = Math.min(firstLength, secondLength);
                const minOverlap = Math.min(
                    maxOverlap,
                    Math.max(2, Math.round(MIN_OVERLAP_PIXELS * first.matchScale))
                );
                if (maxOverlap < minOverlap) return 0;

                const candidates = [];
                for (let overlap = minOverlap; overlap <= maxOverlap; overlap++) {
                    candidates.push({
                        overlap,
                        difference: calculateOverlapDifference(first, second, overlap, false, axis)
                    });
                }
                candidates.sort((a, b) => a.difference - b.difference);

                const best = candidates[0];
                if (!best || best.difference > (1 - OVERLAP_SIMILARITY_THRESHOLD)) {
                    return 0;
                }
                if (calculateOverlapActivity(first, best.overlap, false, axis) < 0.002) {
                    return 0;
                }

                // 如果大量候选位置都同样相似，通常是纯色背景造成的误匹配，此时不裁剪。
                const separation = Math.max(2, Math.round(best.overlap * 0.02));
                const nextBest = candidates.find(candidate => Math.abs(candidate.overlap - best.overlap) > separation);
                if (nextBest && nextBest.difference - best.difference < 0.0005 && best.difference > 0.002) {
                    return 0;
                }

                const approximateOverlap = Math.round(best.overlap / first.matchScale);
                const refineRadius = Math.max(8, Math.ceil(3 / first.matchScale));
                const firstSourceLength = axis === 'horizontal' ? first.width : first.height;
                const secondSourceLength = axis === 'horizontal' ? second.width : second.height;
                const refineStart = Math.max(MIN_OVERLAP_PIXELS, approximateOverlap - refineRadius);
                const refineEnd = Math.min(firstSourceLength, secondSourceLength, approximateOverlap + refineRadius);
                let refinedBest = { overlap: approximateOverlap, difference: 1 };

                for (let overlap = refineStart; overlap <= refineEnd; overlap++) {
                    const difference = calculateOverlapDifference(first, second, overlap, true, axis);
                    if (difference < refinedBest.difference) {
                        refinedBest = { overlap, difference };
                    }
                }

                return refinedBest.difference <= (1 - OVERLAP_SIMILARITY_THRESHOLD)
                    && calculateOverlapActivity(first, refinedBest.overlap, true, axis) >= 0.002
                    ? refinedBest.overlap
                    : 0;
            }

            function drawStitchSource(outputCtx, source, x, y) {
                outputCtx.drawImage(source.baseCanvas, x, y, source.width, source.height);
                if (source.item.canvas.width > 0 && source.item.canvas.height > 0) {
                    outputCtx.drawImage(
                        source.item.canvas,
                        0,
                        0,
                        source.item.canvas.width,
                        source.item.canvas.height,
                        x,
                        y,
                        source.width,
                        source.height
                    );
                }
            }

            function canvasToPngDataUrl(canvas) {
                return canvas.toDataURL('image/png');
            }

            async function buildStitchedImage(items, axis) {
                if (!items.length) {
                    throw new Error('没有可拼接的图片');
                }
                await Promise.all(items.map(waitForImageReady));
                const stitchAxis = axis === 'horizontal' ? 'horizontal' : 'vertical';
                const isHorizontal = stitchAxis === 'horizontal';
                const maxMatchDimension = Math.max(...items.map(item => Math.max(
                    item.img.naturalWidth || item.naturalWidth,
                    item.img.naturalHeight || item.naturalHeight
                )));
                const commonMatchScale = Math.min(1, MATCH_THUMBNAIL_SIZE / maxMatchDimension);
                const sources = items.map(item => createStitchSource(item, stitchAxis, commonMatchScale));
                const fixedSize = isHorizontal ? sources[0].height : sources[0].width;
                //if (sources.some(source => (isHorizontal ? source.height : source.width) !== fixedSize)) {
                //    throw new Error(isHorizontal
                //        ? '水平拼接要求所有图片的原始高度一致'
                //        : '竖直拼接要求所有图片的原始宽度一致');
                //}

                const overlaps = [];
                let outputLength = isHorizontal ? sources[0].width : sources[0].height;
                for (let index = 1; index < sources.length; index++) {
                    const overlap = findBestOverlap(sources[index - 1], sources[index], stitchAxis);
                    overlaps.push(overlap);
                    outputLength += (isHorizontal ? sources[index].width : sources[index].height) - overlap;
                }

                const outputWidth = isHorizontal ? outputLength : fixedSize;
                const outputHeight = isHorizontal ? fixedSize : outputLength;

                if (!Number.isSafeInteger(outputWidth) || !Number.isSafeInteger(outputHeight)
                    || outputWidth <= 0 || outputHeight <= 0) {
                    throw new Error('拼接后的图片尺寸无效');
                }
                if (outputWidth > 32767 || outputHeight > 32767 || outputWidth * outputHeight > 268000000) {
                    throw new Error('拼接后的图片过大，超出浏览器 Canvas 尺寸限制');
                }

                const outputCanvas = document.createElement('canvas');
                outputCanvas.width = outputWidth;
                outputCanvas.height = outputHeight;
                const outputCtx = outputCanvas.getContext('2d');
                outputCtx.imageSmoothingEnabled = false;

                let offset = 0;
                drawStitchSource(outputCtx, sources[0], isHorizontal ? offset : 0, isHorizontal ? 0 : offset);
                for (let index = 1; index < sources.length; index++) {
                    offset += (isHorizontal ? sources[index - 1].width : sources[index - 1].height) - overlaps[index - 1];
                    drawStitchSource(
                        outputCtx,
                        sources[index],
                        isHorizontal ? offset : 0,
                        isHorizontal ? 0 : offset
                    );
                }

                const dataUrl = canvasToPngDataUrl(outputCanvas);
                if (!dataUrl || dataUrl === 'data:,') {
                    throw new Error('浏览器无法导出拼接结果');
                }
                return { dataUrl, width: outputWidth, height: outputHeight, overlaps, axis: stitchAxis };
            }

            async function autoStitchImages() {
                const stitchItems = images.filter(item => !item.isStitchResult);
                if (stitchItems.length < 2) {
                    setStitchStatus('至少需要两张图片', true);
                    return;
                }

                autoStitchBtn.disabled = true;
                setStitchStatus('正在分析相邻截图的重复区域，请稍候…', false);
                try {
                    const result = await buildStitchedImage(stitchItems, layoutMode);
                    const removedPixels = result.overlaps.reduce((total, overlap) => total + overlap, 0);
                    const detectedCount = result.overlaps.filter(overlap => overlap > 0).length;
                    const stitchedItem = addImageToContainer(result.dataUrl, '自动拼接结果', { isStitchResult: true });
                    if (stitchedItem) {
                        const directionLabel = result.axis === 'horizontal' ? '水平' : '竖直';
                        setStitchStatus(
                            `${directionLabel}拼接完成：${result.width} × ${result.height}，检测到 ${detectedCount} 处重叠，共去除约 ${removedPixels} 像素的重复内容`,
                            false
                        );
                    }
                } catch (error) {
                    setStitchStatus(error.message || '自动拼接失败', true);
                } finally {
                    autoStitchBtn.disabled = false;
                }
            }

            // 点击按钮粘贴：优先 Clipboard API，失败时回退到 Ctrl+V 引导
            pasteBtn.addEventListener('click', async function() {
                if (navigator.clipboard && navigator.clipboard.read) {
                    try {
                        const clipboardItems = await navigator.clipboard.read();
                        for (const clipboardItem of clipboardItems) {
                            const imageType = clipboardItem.types.find(t => t.startsWith('image/'));
                            if (!imageType) continue;
                            const blob = await clipboardItem.getType(imageType);
                            const reader = new FileReader();
                            reader.onload = function(event) {
                                addImageToContainer(event.target.result);
                            };
                            reader.readAsDataURL(blob);
                            return;
                        }
                    } catch (err) {
                        // 忽略后走回退
                    }
                }
                pasteArea.focus();
                alert('浏览器未授予剪贴板读取权限，请按 Ctrl+V 粘贴图片。');
            });

            // 添加图片到容器
            function addImageToContainer(imageData, customName, options) {
                const imageWrapper = document.createElement('div');
                imageWrapper.className = 'image-wrapper';

                const dragHandle = document.createElement('div');
                dragHandle.className = 'drag-handle';

                const dragTitle = document.createElement('span');
                dragTitle.className = 'drag-title';
                dragTitle.textContent = '拖动图片';

                const itemTools = document.createElement('div');
                itemTools.className = 'item-tools';

                const sizeLabel = document.createElement('label');
                sizeLabel.textContent = '缩放';

                const zoomOutBtn = document.createElement('button');
                zoomOutBtn.type = 'button';
                zoomOutBtn.className = 'zoom-btn';
                zoomOutBtn.textContent = '-';

                const sizeInput = document.createElement('input');
                sizeInput.type = 'number';
                sizeInput.className = 'zoom-input';
                sizeInput.min = '20';
                sizeInput.max = '300';
                sizeInput.step = '1';
                sizeInput.value = '100';

                const sizeText = document.createElement('span');
                sizeText.textContent = '%';

                const zoomInBtn = document.createElement('button');
                zoomInBtn.type = 'button';
                zoomInBtn.className = 'zoom-btn';
                zoomInBtn.textContent = '+';

                itemTools.appendChild(sizeLabel);
                itemTools.appendChild(zoomOutBtn);
                itemTools.appendChild(sizeInput);
                itemTools.appendChild(sizeText);
                itemTools.appendChild(zoomInBtn);
                dragHandle.appendChild(dragTitle);
                dragHandle.appendChild(itemTools);

                const stage = document.createElement('div');
                stage.className = 'image-stage';

                const img = document.createElement('img');
                img.src = imageData;
                img.draggable = false;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                stage.appendChild(img);
                stage.appendChild(canvas);
                imageWrapper.appendChild(dragHandle);
                imageWrapper.appendChild(stage);
                imageContainer.appendChild(imageWrapper);
                
                const item = {
                    id: imageIdSeed++,
                    name: customName || `图片${imageIdSeed - 1}`,
                    isStitchResult: Boolean(options && options.isStitchResult),
                    wrapper: imageWrapper,
                    img,
                    canvas,
                    ctx,
                    scale: 1,
                    x: 10 + images.length * 24,
                    y: 10 + images.length * 24,
                    naturalWidth: 0,
                    naturalHeight: 0
                };

                images.push(item);
                bringToFront(item);
                setSelectedItem(item);
                placeItem(item, item.x, item.y);
                renderImageList();

                img.onload = function() {
                    item.naturalWidth = img.naturalWidth;
                    item.naturalHeight = img.naturalHeight;
                    applyScale(item, 1);
                    if (layoutMode === 'vertical') arrangeVertical();
                    if (layoutMode === 'horizontal') arrangeHorizontal();
                };

                function applyZoomFromPercent(percent) {
                    if (!item.naturalWidth || !item.naturalHeight) return;
                    const safePercent = Math.max(20, Math.min(300, Math.round(percent)));
                    sizeInput.value = String(safePercent);
                    applyScale(item, safePercent / 100);
                    if (layoutMode === 'vertical') arrangeVertical();
                    if (layoutMode === 'horizontal') arrangeHorizontal();
                }

                zoomOutBtn.addEventListener('click', function() {
                    applyZoomFromPercent(Number(sizeInput.value || '100') - 5);
                });

                zoomInBtn.addEventListener('click', function() {
                    applyZoomFromPercent(Number(sizeInput.value || '100') + 5);
                });

                sizeInput.addEventListener('change', function() {
                    const value = Number(this.value);
                    if (Number.isNaN(value)) {
                        this.value = '100';
                        applyZoomFromPercent(100);
                        return;
                    }
                    applyZoomFromPercent(value);
                });

                // 缩放区域阻止冒泡，避免触发拖动逻辑
                [zoomOutBtn, sizeInput, zoomInBtn, itemTools, sizeText].forEach(el => {
                    el.addEventListener('pointerdown', e => e.stopPropagation());
                    el.addEventListener('mousedown', e => e.stopPropagation());
                    el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
                    el.addEventListener('click', e => e.stopPropagation());
                });

                canvas.addEventListener('mousedown', function(e) {
                    if (activeTool === 'select') {
                        return;
                    }
                    e.stopPropagation();
                    startDrawing(e, item);
                });
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseleave', stopDrawing);

                // 拖动图片位置：仅拖动标题区触发，避免与缩放控件冲突
                dragTitle.addEventListener('mousedown', function(e) {
                    if (activeTool === 'select' || activeTool === 'draw' || activeTool === 'erase') {
                        // 三种模式都允许拖动；保持已有行为
                    }
                    isDragging = true;
                    bringToFront(item);
                    setSelectedItem(item);
                    const rect = imageContainer.getBoundingClientRect();
                    dragState = {
                        item,
                        offsetX: e.clientX - rect.left - item.x,
                        offsetY: e.clientY - rect.top - item.y
                    };
                    e.preventDefault();
                });

                imageWrapper.addEventListener('mousedown', function() {
                    bringToFront(item);
                    setSelectedItem(item);
                });

                return item;
            }

            function bringToFront(item) {
                item.wrapper.style.zIndex = String(++zIndexSeed);
            }

            function placeItem(item, x, y) {
                item.x = x;
                item.y = y;
                item.wrapper.style.left = `${x}px`;
                item.wrapper.style.top = `${y}px`;
            }

            function applyScale(item, scale) {
                if (!item.naturalWidth || !item.naturalHeight) {
                    return;
                }
                const oldImage = item.canvas.width > 0 && item.canvas.height > 0 ? item.canvas.toDataURL() : null;
                item.scale = scale;
                const width = Math.max(40, Math.round(item.naturalWidth * scale));
                const height = Math.max(40, Math.round(item.naturalHeight * scale));

                item.img.style.width = `${width}px`;
                item.img.style.height = `${height}px`;
                item.canvas.width = width;
                item.canvas.height = height;
                item.canvas.style.width = `${width}px`;
                item.canvas.style.height = `${height}px`;

                item.ctx.clearRect(0, 0, width, height);
                if (oldImage) {
                    const temp = new Image();
                    temp.onload = function() {
                        item.ctx.drawImage(temp, 0, 0, width, height);
                    };
                    temp.src = oldImage;
                }
            }

            // 涂鸦功能
            function startDrawing(e, item) {
                if (activeTool === 'select') {
                    return;
                }
                isDrawing = true;
                currentItem = item;
                setSelectedItem(item);
                const ctx = item.ctx;
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                if (activeTool === 'erase') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = 20;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = 'red';
                    ctx.lineWidth = 3;
                }
                ctx.moveTo(e.offsetX, e.offsetY);
            }

            function draw(e) {
                if (!isDrawing || !currentItem) return;
                const ctx = currentItem.ctx;
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
            }

            imageContainer.addEventListener('click', function(e) {
                if (activeTool !== 'select') return;
                const rect = imageContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const hitItems = images.filter(item => {
                    const left = item.x;
                    const top = item.y;
                    const right = left + item.wrapper.offsetWidth;
                    const bottom = top + item.wrapper.offsetHeight;
                    return x >= left && x <= right && y >= top && y <= bottom;
                }).sort((a, b) => Number(b.wrapper.style.zIndex || 0) - Number(a.wrapper.style.zIndex || 0));

                if (!hitItems.length) return;

                const nearSamePoint = Math.abs(selectCycle.x - x) < 6 && Math.abs(selectCycle.y - y) < 6;
                if (!nearSamePoint) {
                    selectCycle = { x, y, index: 0 };
                }

                const pick = hitItems[selectCycle.index % hitItems.length];
                selectCycle.index += 1;
                bringToFront(pick);
                setSelectedItem(pick);
            });

            function stopDrawing() {
                isDrawing = false;
                currentItem = null;
            }

            document.addEventListener('mousemove', function(e) {
                if (!isDragging || !dragState) return;
                const rect = imageContainer.getBoundingClientRect();
                const x = e.clientX - rect.left - dragState.offsetX;
                const y = e.clientY - rect.top - dragState.offsetY;
                placeItem(dragState.item, x, y);
            });

            document.addEventListener('mouseup', function() {
                isDragging = false;
                dragState = null;
            });

            // 排列功能
            function arrangeVertical() {
                layoutMode = 'vertical';
                let y = 10;
                images.forEach(item => {
                    placeItem(item, 10, y);
                    y += item.wrapper.offsetHeight + 10;
                });
            }

            function arrangeHorizontal() {
                layoutMode = 'horizontal';
                let x = 10;
                images.forEach(item => {
                    placeItem(item, x, 10);
                    x += item.wrapper.offsetWidth + 10;
                });
            }

            arrangeVerticalBtn.addEventListener('click', arrangeVertical);
            arrangeHorizontalBtn.addEventListener('click', arrangeHorizontal);

            // 清除所有
            clearAllBtn.addEventListener('click', function() {
                imageContainer.innerHTML = '';
                imageList.innerHTML = '';
                images = [];
                isDrawing = false;
                currentItem = null;
                selectedItem = null;
                setStitchStatus('', false);
            });

            deleteSelectedBtn.addEventListener('click', function() {
                if (!selectedItem) return;
                const removeId = selectedItem.id;
                if (selectedItem.wrapper && selectedItem.wrapper.parentNode) {
                    selectedItem.wrapper.parentNode.removeChild(selectedItem.wrapper);
                }
                images = images.filter(it => it.id !== removeId);
                selectedItem = images.length ? images[images.length - 1] : null;
                if (selectedItem) {
                    bringToFront(selectedItem);
                }
                setSelectedItem(selectedItem);
                renderImageList();
            });
        });
    </script>
</body>
</html>
