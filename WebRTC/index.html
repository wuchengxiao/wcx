<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC DataChannel 聊天示例</title>
  <style>
    body {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: Arial, sans-serif;
      color: #222;
    }

    h1 { font-size: 24px; }

    .row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    input, button {
      padding: 9px;
      font-size: 14px;
    }

    input { flex: 1; }
    button { cursor: pointer; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #myPeerId {
      padding: 10px;
      background: #f3f3f3;
      border-radius: 4px;
      word-break: break-all;
    }

    #status {
      color: #555;
      margin: 12px 0;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fafafa;
    }

    .message { margin: 8px 0; }
    .system { color: #777; font-style: italic; }
    .mine { color: #0757a6; }
    .other { color: #16803c; }

    #toolbar {
      position: relative;
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .tool-button {
      min-width: 42px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }

    .tool-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #emojiPicker {
      position: absolute;
      bottom: 42px;
      left: 0;
      display: grid;
      grid-template-columns: repeat(8, 36px);
      gap: 4px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
      z-index: 1;
    }

    #emojiPicker[hidden] { display: none; }

    .emoji-option {
      padding: 5px;
      border: 0;
      background: transparent;
      font-size: 20px;
    }

    .emoji-option:hover { background: #f0f0f0; }

    .file-link {
      color: #0757a6;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>WebRTC DataChannel 网页聊天</h1>

  <p>我的 Peer ID：</p>
  <div id="myPeerId">正在生成...</div>

  <div class="row">
    <label class="visually-hidden" for="remotePeerId">对方 Peer ID</label>
    <input id="remotePeerId" placeholder="输入对方的 Peer ID" />
    <button id="connectButton">连接</button>
  </div>

  <div id="status">正在连接信令服务...</div>
  <div id="messages"></div>

  <div id="toolbar" aria-label="聊天工具栏">
    <button id="emojiButton" class="tool-button" type="button" title="选择表情" disabled>😊</button>
    <button id="fileButton" class="tool-button" type="button" title="发送文件" disabled>📎</button>
    <input id="fileInput" type="file" hidden />
    <div id="emojiPicker" hidden aria-label="表情选择器">
      <button class="emoji-option" type="button">😀</button>
      <button class="emoji-option" type="button">😂</button>
      <button class="emoji-option" type="button">😍</button>
      <button class="emoji-option" type="button">😎</button>
      <button class="emoji-option" type="button">🤔</button>
      <button class="emoji-option" type="button">😭</button>
      <button class="emoji-option" type="button">👍</button>
      <button class="emoji-option" type="button">❤️</button>
      <button class="emoji-option" type="button">🎉</button>
      <button class="emoji-option" type="button">🔥</button>
      <button class="emoji-option" type="button">✅</button>
      <button class="emoji-option" type="button">🙏</button>
    </div>
  </div>

  <div class="row">
    <label class="visually-hidden" for="messageInput">聊天消息</label>
    <input id="messageInput" placeholder="输入消息" disabled />
    <button id="sendButton" disabled>发送</button>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const myPeerIdElement = document.getElementById("myPeerId");
    const remotePeerIdInput = document.getElementById("remotePeerId");
    const connectButton = document.getElementById("connectButton");
    const statusElement = document.getElementById("status");
    const messagesElement = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const emojiButton = document.getElementById("emojiButton");
    const fileButton = document.getElementById("fileButton");
    const fileInput = document.getElementById("fileInput");
    const emojiPicker = document.getElementById("emojiPicker");

    let peer = null;
    let connection = null;
    let incomingFile = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function addMessage(message, type = "system") {
      const element = document.createElement("div");
      element.className = `message ${type}`;
      element.textContent = message;
      messagesElement.appendChild(element);
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function setChatEnabled(enabled) {
      messageInput.disabled = !enabled;
      sendButton.disabled = !enabled;
      emojiButton.disabled = !enabled;
      fileButton.disabled = !enabled;
    }

    function addDownloadMessage(fileName, url) {
      const wrapper = document.createElement("div");
      wrapper.className = "message other";
      wrapper.append("对方发送了文件：");

      const link = document.createElement("a");
      link.className = "file-link";
      link.href = url;
      link.download = fileName;
      link.textContent = fileName;
      wrapper.appendChild(link);

      messagesElement.appendChild(wrapper);
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const blockSize = 0x8000;
      for (let index = 0; index < bytes.length; index += blockSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + blockSize));
      }
      return btoa(binary);
    }

    function handleIncomingData(data) {
      if (!data || typeof data !== "object" || !data.type) {
        addMessage(`对方：${data}`, "other");
        return;
      }

      if (data.type === "file-start") {
        incomingFile = {
          name: data.name,
          mime: data.mime || "application/octet-stream",
          chunks: [],
          received: 0,
          size: data.size
        };
        addMessage(`正在接收文件：${data.name}`, "system");
      } else if (data.type === "file-chunk" && incomingFile) {
        incomingFile.chunks.push(base64ToBytes(data.content));
        incomingFile.received += data.content.length;
      } else if (data.type === "file-end" && incomingFile) {
        const blob = new Blob(incomingFile.chunks, { type: incomingFile.mime });
        const url = URL.createObjectURL(blob);
        addDownloadMessage(incomingFile.name, url);
        incomingFile = null;
      }
    }

    function setupConnection(conn) {
      connection = conn;
      setStatus("正在建立 WebRTC 连接...");

      conn.on("open", () => {
        setStatus(`已连接到对方：${conn.peer}`);
        setChatEnabled(true);
        addMessage("WebRTC DataChannel 已建立", "system");
      });

      conn.on("data", handleIncomingData);

      conn.on("close", () => {
        setStatus("对方已断开连接");
        setChatEnabled(false);
        addMessage("连接已关闭", "system");
      });

      conn.on("error", error => {
        console.error("DataConnection error:", error);
        setStatus("数据连接发生错误");
        addMessage("数据连接发生错误", "system");
      });
    }

    peer = new Peer(undefined, {
      host: "0.peerjs.com",
      port: 443,
      path: "/",
      secure: true,
      debug: 2,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" }
        ]
      }
    });

    peer.on("open", id => {
      myPeerIdElement.textContent = id;
      setStatus("信令服务已连接，可以把 Peer ID 发给对方");
      addMessage("你的 Peer ID 已生成", "system");
    });

    peer.on("connection", conn => {
      addMessage(`收到来自 ${conn.peer} 的连接请求`, "system");
      setupConnection(conn);
    });

    peer.on("error", error => {
      console.error("Peer error:", error);
      if (error.type === "peer-unavailable") {
        setStatus("找不到对方 Peer ID");
      } else if (error.type === "network") {
        setStatus("无法连接到信令服务");
      } else {
        setStatus(`PeerJS 错误：${error.type}`);
      }
    });

    peer.on("disconnected", () => {
      setStatus("已断开信令服务");
      setChatEnabled(false);
    });

    connectButton.addEventListener("click", () => {
      const remotePeerId = remotePeerIdInput.value.trim();
      if (!remotePeerId) {
        alert("请输入对方的 Peer ID");
        return;
      }
      if (remotePeerId === peer.id) {
        alert("不能连接自己");
        return;
      }
      if (connection) connection.close();

      const conn = peer.connect(remotePeerId, {
        reliable: true,
        serialization: "json"
      });
      setupConnection(conn);
    });

    function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      if (!connection || !connection.open) {
        addMessage("当前没有可用连接", "system");
        return;
      }

      connection.send(message);
      addMessage(`我：${message}`, "mine");
      messageInput.value = "";
      messageInput.focus();
    }

    async function sendFile(file) {
      if (!file || !connection || !connection.open) {
        addMessage("当前没有可用连接，无法发送文件", "system");
        return;
      }

      const maxFileSize = 20 * 1024 * 1024;
      if (file.size > maxFileSize) {
        addMessage("文件不能超过 20 MB", "system");
        return;
      }

      const chunkSize = 12 * 1024;
      connection.send({
        type: "file-start",
        name: file.name,
        mime: file.type,
        size: file.size
      });

      for (let offset = 0; offset < file.size; offset += chunkSize) {
        const bytes = new Uint8Array(await file.slice(offset, offset + chunkSize).arrayBuffer());
        connection.send({
          type: "file-chunk",
          content: bytesToBase64(bytes)
        });
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      connection.send({ type: "file-end" });
      addMessage(`我发送了文件：${file.name}`, "mine");
    }

    sendButton.addEventListener("click", sendMessage);
    messageInput.addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });

    emojiButton.addEventListener("click", () => {
      emojiPicker.hidden = !emojiPicker.hidden;
    });

    document.querySelectorAll(".emoji-option").forEach(button => {
      button.addEventListener("click", () => {
        const start = messageInput.selectionStart;
        const end = messageInput.selectionEnd;
        messageInput.value = `${messageInput.value.slice(0, start)}${button.textContent}${messageInput.value.slice(end)}`;
        messageInput.focus();
        messageInput.setSelectionRange(start + button.textContent.length, start + button.textContent.length);
        emojiPicker.hidden = true;
      });
    });

    fileButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const [file] = fileInput.files;
      if (file) sendFile(file);
      fileInput.value = "";
    });

    document.addEventListener("click", event => {
      if (!emojiPicker.contains(event.target) && event.target !== emojiButton) {
        emojiPicker.hidden = true;
      }
    });
  </script>
</body>
</html>
